<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="theme-color"
            content="#eeeef4"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#1a1a1a"
            media="(prefers-color-scheme: dark)"
        />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="description"
            content="Portfolio of Mohammadreza Fathpour — Front-end Developer specializing in React, Next.js, modern UI/UX, and fast, responsive web applications."
        />
        <link
            rel="icon"
            href="%PUBLIC_URL%/icons/favicon.ico"
            sizes="16x16 32x32 48x48"
        />
        <link
            rel="icon"
            type="image/svg+xml"
            href="%PUBLIC_URL%/icons/favicon.svg"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="%PUBLIC_URL%/icons/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="%PUBLIC_URL%/icons/favicon-16x16.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="%PUBLIC_URL%/icons/apple-touch-icon.png"
        />
        <meta name="apple-mobile-web-app-title" content="&lt;/ MR &gt;" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <title>&lt;/ MR &gt;</title>
        <style>
            body {
                background-color: #eeeef4;
                color: #1a1a1a;
            }

            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #1a1a1a;
                    color: #eeeef4;
                }
            }

            /* ---------- Loader, until the app has fully loaded ----------
               Here rather than in the app, so it shows before the app's
               code, styles, fonts and images have arrived. The script at
               the end of <body> takes it away. */
            .app-loader {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: grid;
                place-items: center;
                background-color: #eeeef4;
                transition: opacity 0.4s ease, visibility 0s 0.4s;
            }

            @media (prefers-color-scheme: dark) {
                .app-loader {
                    background-color: #1a1a1a;
                }
            }

            .app-loader.is-done {
                opacity: 0;
                visibility: hidden;
            }

            /* The logo only appears if loading takes a moment, so a fast
               load does not flash it */
            .app-loader-logo {
                position: relative;
                width: 6rem;
                height: 6rem;
                animation: app-loader-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)
                    0.3s both;
            }

            .app-loader-logo svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            .app-loader-tile {
                fill: #ff6b35;
            }

            /* The letters are built from their pixels exactly as on the
               offline page: each drops into place, column by column from
               the left (--i, its turn). Once all are in, they leave in the reverse
               order, last in first out, and it starts over (the script at
               the end of <body> switches .is-filled on and off). */
            .app-loader-pixels rect {
                fill: #14110f;
                transform-box: fill-box;
                transform-origin: center;
                opacity: 0;
                transform: translateY(-7px) scale(0.4);
                transition: opacity 0.55s cubic-bezier(0.22, 1.4, 0.36, 1),
                    transform 0.55s cubic-bezier(0.22, 1.4, 0.36, 1);
                /* Leaving: the last to arrive goes first */
                transition-delay: calc((var(--n) - 1 - var(--i)) * 28ms);
            }

            .app-loader-pixels.is-filled rect {
                opacity: 1;
                transform: none;
                transition-delay: calc(var(--i) * 28ms);
            }

            @keyframes app-loader-in {
                from {
                    opacity: 0;
                    transform: scale(0.6) rotate(-8deg);
                }
            }

            .app-loader-label {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }

            @media (prefers-reduced-motion: reduce) {
                .app-loader-logo {
                    animation: none;
                }

                .app-loader-pixels rect {
                    opacity: 1;
                    transform: none;
                    transition: none;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>

        <div id="app-loader" class="app-loader" role="status">
            <div class="app-loader-logo" aria-hidden="true">
                <svg
                    class="app-loader-tile"
                    viewBox="0 0 16 16"
                    shape-rendering="crispEdges"
                >
                    <rect width="16" height="16" rx="3" />
                </svg>
                <svg
                    id="app-loader-pixels"
                    class="app-loader-pixels"
                    viewBox="0 0 16 16"
                    shape-rendering="crispEdges"
                ></svg>
            </div>
            <span class="app-loader-label">Loading…</span>
        </div>

        <script>
            // Takes the loader away once the app has fully loaded: the page
            // and everything it started loading (code, styles, images), the
            // fonts, and the images the app put on the page itself
            (function () {
                var loader = document.getElementById("app-loader");
                if (!loader) return;

                // The "MR" letters of icons/favicon.svg as [x, y, width,
                // height] blocks on its 16 x 16 grid, split into pixels
                var BLOCKS = [
                    [2, 4, 1, 8], [6, 4, 1, 8], [3, 5, 1, 1], [5, 5, 1, 1],
                    [4, 6, 1, 2], [9, 4, 1, 8], [10, 4, 3, 1], [13, 5, 1, 3],
                    [10, 8, 3, 1], [11, 9, 1, 1], [12, 10, 1, 1],
                    [13, 11, 1, 1],
                ];
                var cells = [];
                BLOCKS.forEach(function (b) {
                    for (var x = b[0]; x < b[0] + b[2]; x++) {
                        for (var y = b[1]; y < b[1] + b[3]; y++) {
                            cells.push([x, y]);
                        }
                    }
                });

                // As on the offline page: column by column, left to right
                cells.sort(function (a, b) {
                    return a[0] - b[0] || a[1] - b[1];
                });

                var pixels = document.getElementById("app-loader-pixels");
                pixels.style.setProperty("--n", cells.length);
                cells.forEach(function (cell, i) {
                    var rect = document.createElementNS(
                        "http://www.w3.org/2000/svg",
                        "rect"
                    );
                    rect.setAttribute("x", cell[0]);
                    rect.setAttribute("y", cell[1]);
                    rect.setAttribute("width", 1);
                    rect.setAttribute("height", 1);
                    rect.style.setProperty("--i", i);
                    pixels.appendChild(rect);
                });

                // One way (all pixels in, or all out) takes the last pixel's
                // turn plus its drop; then a short pause before turning back
                var ONE_WAY_MS = (cells.length - 1) * 28 + 550;
                var PAUSE_MS = { filled: 500, empty: 300 };
                var loopTimer;

                var fill = function (isFilled) {
                    pixels.classList.toggle("is-filled", isFilled);
                    loopTimer = setTimeout(function () {
                        fill(!isFilled);
                    }, ONE_WAY_MS + PAUSE_MS[isFilled ? "filled" : "empty"]);
                };

                var reduceMotion = window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                ).matches;

                // Starts as the logo pops in (see .app-loader-logo)
                if (reduceMotion) pixels.classList.add("is-filled");
                else loopTimer = setTimeout(function () {
                    fill(true);
                }, 450);

                var isDone = false;
                var hide = function () {
                    if (isDone) return;
                    isDone = true;

                    loader.classList.add("is-done");
                    setTimeout(function () {
                        clearTimeout(loopTimer);
                        loader.remove();
                    }, 600);
                };

                var imagesLoaded = function () {
                    var pending = Array.prototype.filter.call(
                        document.images,
                        function (img) {
                            return !img.complete;
                        }
                    );

                    return Promise.all(
                        pending.map(function (img) {
                            return new Promise(function (resolve) {
                                img.addEventListener("load", resolve);
                                img.addEventListener("error", resolve);
                            });
                        })
                    );
                };

                // Two frames, so the app has put its first images on the page
                var nextFrames = function () {
                    return new Promise(function (resolve) {
                        requestAnimationFrame(function () {
                            requestAnimationFrame(resolve);
                        });
                    });
                };

                window.addEventListener("load", function () {
                    Promise.all([
                        document.fonts ? document.fonts.ready : null,
                        nextFrames().then(imagesLoaded),
                    ]).then(hide, hide);
                });

                // Never longer than this, even if something never arrives
                setTimeout(hide, 30000);
            })();
        </script>
    </body>
</html>
